<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EarnPulse Wallet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f3f7f5;
    color:#10231b;
}

.header{
    background:linear-gradient(135deg,#087f4b,#13b86a);
    color:white;
    padding:22px 18px;
    border-radius:0 0 25px 25px;
}

.header h1{
    font-size:25px;
}

.header p{
    margin-top:6px;
    opacity:.9;
}

.container{
    width:min(94%,600px);
    margin:20px auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.balance-title{
    color:#718078;
    font-size:14px;
}

.balance{
    font-size:36px;
    font-weight:bold;
    margin-top:7px;
    color:#087f4b;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.stat{
    background:#f3f8f5;
    padding:15px;
    border-radius:14px;
}

.stat small{
    color:#718078;
}

.stat strong{
    display:block;
    margin-top:6px;
}

h2{
    font-size:20px;
    margin-bottom:16px;
}

label{
    display:block;
    margin:13px 0 7px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d8e2dd;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

input:focus{
    border-color:#0ba960;
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    margin-top:16px;
    background:#0aa960;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.withdraw{
    background:#10231b;
}

.message{
    margin-top:14px;
    padding:12px;
    border-radius:10px;
    display:none;
    font-size:14px;
}

.success{
    display:block;
    background:#e4f8ed;
    color:#087f4b;
}

.error{
    display:block;
    background:#ffe9e9;
    color:#b42318;
}

.loading{
    display:none;
    text-align:center;
    margin-top:12px;
    color:#087f4b;
}

.note{
    font-size:13px;
    color:#718078;
    margin-top:10px;
    line-height:1.5;
}

.back{
    display:inline-block;
    color:white;
    text-decoration:none;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="header">

    <h1>💰 EarnPulse Wallet</h1>

    <p>Manage your wallet and payments</p>

    <a href="/Dashboard.html" class="back">
        ← Dashboard
    </a>

</div>


<div class="container">

    <!-- BALANCE -->

    <div class="card">

        <div class="balance-title">
            Available Balance
        </div>

        <div class="balance" id="balance">
            KES 0.00
        </div>

        <div class="row">

            <div class="stat">

                <small>Total Deposits</small>

                <strong id="totalDeposits">
                    KES 0.00
                </strong>

            </div>

            <div class="stat">

                <small>Total Withdrawals</small>

                <strong id="totalWithdrawals">
                    KES 0.00
                </strong>

            </div>

        </div>

    </div>


    <!-- DEPOSIT -->

    <div class="card">

        <h2>📲 Deposit via M-Pesa</h2>

        <label for="phone">
            M-Pesa Phone Number
        </label>

        <input
            id="phone"
            type="tel"
            inputmode="numeric"
            placeholder="0712345678"
            autocomplete="tel"
        >

        <label for="amount">
            Deposit Amount
        </label>

        <input
            id="amount"
            type="number"
            min="1"
            step="1"
            placeholder="Enter amount"
        >

        <p class="note">
            Enter the M-Pesa number that should receive the STK Push.
        </p>

        <button
            id="depositBtn"
            onclick="deposit()"
        >
            Send STK Push
        </button>

        <div
            id="loading"
            class="loading"
        >
            Processing STK Push...
        </div>

        <div
            id="depositMessage"
            class="message"
        ></div>

    </div>


    <!-- WITHDRAW -->

    <div class="card">

        <h2>💸 Withdraw</h2>

        <label for="withdrawPhone">
            M-Pesa Phone Number
        </label>

        <input
            id="withdrawPhone"
            type="tel"
            inputmode="numeric"
            placeholder="0712345678"
            autocomplete="tel"
        >

        <label for="withdrawAmount">
            Withdrawal Amount
        </label>

        <input
            id="withdrawAmount"
            type="number"
            min="1"
            step="1"
            placeholder="Enter amount"
        >

        <button
            class="withdraw"
            onclick="withdraw()"
        >
            Withdraw Funds
        </button>

        <div
            id="withdrawMessage"
            class="message"
        ></div>

    </div>

</div>


<script>

/*
|--------------------------------------------------------------------------
| API CONFIG
|--------------------------------------------------------------------------
*/

const API_URL =
    window.location.origin;


/*
|--------------------------------------------------------------------------
| TOKEN
|--------------------------------------------------------------------------
|
| Change this if your login page stores the JWT
| under another name.
|--------------------------------------------------------------------------
*/

function getToken(){

    return (
        localStorage.getItem("token") ||
        localStorage.getItem("accessToken") ||
        localStorage.getItem("jwt")
    );

}


/*
|--------------------------------------------------------------------------
| MONEY FORMAT
|--------------------------------------------------------------------------
*/

function money(value){

    return "KES " +
        Number(value || 0)
        .toLocaleString(
            "en-KE",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/*
|--------------------------------------------------------------------------
| NORMALIZE PHONE
|--------------------------------------------------------------------------
*/

function normalizePhone(phone){

    phone =
        String(phone)
        .trim()
        .replace(/\s+/g,"");

    if(
        phone.startsWith("07") ||
        phone.startsWith("01")
    ){

        return "254" +
            phone.substring(1);

    }

    if(
        phone.startsWith("+254")
    ){

        return phone.substring(1);

    }

    return phone;

}


/*
|--------------------------------------------------------------------------
| LOAD WALLET
|--------------------------------------------------------------------------
*/

async function loadWallet(){

    const token =
        getToken();

    if(!token){

        showMessage(
            "depositMessage",
            "Please login first.",
            false
        );

        return;

    }

    try{

        const response =
            await fetch(
                `${API_URL}/api/wallet`,
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load wallet"
            );

        }

        const wallet =
            data.wallet ||
            data.data ||
            data;

        document.getElementById(
            "balance"
        ).textContent =
            money(
                wallet.balance
            );

        document.getElementById(
            "totalDeposits"
        ).textContent =
            money(
                wallet.totalDeposits
            );

        document.getElementById(
            "totalWithdrawals"
        ).textContent =
            money(
                wallet.totalWithdrawals
            );

    }catch(error){

        console.error(
            "Wallet error:",
            error
        );

        showMessage(
            "depositMessage",
            error.message,
            false
        );

    }

}


/*
|--------------------------------------------------------------------------
| STK PUSH
|--------------------------------------------------------------------------
*/

async function deposit(){

    const phoneInput =
        document.getElementById(
            "phone"
        );

    const amountInput =
        document.getElementById(
            "amount"
        );

    const button =
        document.getElementById(
            "depositBtn"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const phone =
        normalizePhone(
            phoneInput.value
        );

    const amount =
        Number(
            amountInput.value
        );


    if(!phone){

        showMessage(
            "depositMessage",
            "Enter your M-Pesa phone number.",
            false
        );

        return;

    }


    if(
        !/^254(7|1)\d{8}$/.test(phone)
    ){

        showMessage(
            "depositMessage",
            "Enter a valid Kenyan M-Pesa number.",
            false
        );

        return;

    }


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showMessage(
            "depositMessage",
            "Enter a valid deposit amount.",
            false
        );

        return;

    }


    const token =
        getToken();

    if(!token){

        showMessage(
            "depositMessage",
            "Please login first.",
            false
        );

        return;

    }


    button.disabled =
        true;

    loading.style.display =
        "block";


    try{

        const response =
            await fetch(
                `${API_URL}/api/payment/stkpush`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:JSON.stringify({

                        phoneNumber:
                            phone,

                        amount:
                            amount

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "STK Push failed"
            );

        }


        showMessage(
            "depositMessage",
            data.message ||
            "STK Push sent. Check your M-Pesa phone.",
            true
        );


        amountInput.value =
            "";


    }catch(error){

        console.error(
            "STK Push error:",
            error
        );

        showMessage(
            "depositMessage",
            error.message,
            false
        );

    }finally{

        button.disabled =
            false;

        loading.style.display =
            "none";

    }

}


/*
|--------------------------------------------------------------------------
| WITHDRAW
|--------------------------------------------------------------------------
*/

async function withdraw(){

    const phone =
        normalizePhone(
            document.getElementById(
                "withdrawPhone"
            ).value
        );

    const amount =
        Number(
            document.getElementById(
                "withdrawAmount"
            ).value
        );


    if(
        !/^254(7|1)\d{8}$/.test(phone)
    ){

        showMessage(
            "withdrawMessage",
            "Enter a valid Kenyan M-Pesa number.",
            false
        );

        return;

    }


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showMessage(
            "withdrawMessage",
            "Enter a valid withdrawal amount.",
            false
        );

        return;

    }


    const token =
        getToken();

    if(!token){

        showMessage(
            "withdrawMessage",
            "Please login first.",
            false
        );

        return;

    }


    try{

        /*
         * Adjust this endpoint if your
         * wallet route uses a different
         * withdrawal path.
         */

        const response =
            await fetch(
                `${API_URL}/api/wallet/withdraw`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:JSON.stringify({

                        phoneNumber:
                            phone,

                        amount:
                            amount

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Withdrawal failed"
            );

        }


        showMessage(
            "withdrawMessage",
            data.message ||
            "Withdrawal request submitted.",
            true
        );


        document.getElementById(
            "withdrawAmount"
        ).value = "";


        await loadWallet();


    }catch(error){

        console.error(
            "Withdrawal error:",
            error
        );

        showMessage(
            "withdrawMessage",
            error.message,
            false
        );

    }

}


/*
|--------------------------------------------------------------------------
| MESSAGE
|--------------------------------------------------------------------------
*/

function showMessage(
    elementId,
    message,
    success
){

    const element =
        document.getElementById(
            elementId
        );

    element.textContent =
        message;

    element.className =
        "message " +
        (
            success
                ? "success"
                : "error"
        );

}


/*
|--------------------------------------------------------------------------
| INITIALIZE
|--------------------------------------------------------------------------
*/

loadWallet();

</script>

</body>
  </html>

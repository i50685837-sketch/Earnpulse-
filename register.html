<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnPulse • Create Account</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    radial-gradient(circle at top right,#19c97855,transparent 35%),
    radial-gradient(circle at bottom left,#08744344,transparent 35%),
    linear-gradient(135deg,#04120e,#0a2a20);

  color:#fff;
}

.container{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:24px;
}

.logo{
  width:68px;
  height:68px;
  margin:auto auto 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:21px;

  background:
    linear-gradient(135deg,#19c978,#087443);

  font-size:27px;
  font-weight:900;

  box-shadow:0 15px 40px #19c97830;
}

.brand h1{
  font-size:28px;
}

.brand p{
  color:#8faea2;
  font-size:13px;
  margin-top:5px;
}

.card{
  padding:26px;

  border-radius:26px;

  background:#ffffff0b;
  border:1px solid #ffffff16;

  backdrop-filter:blur(18px);

  box-shadow:0 25px 70px #0007;
}

.card h2{
  font-size:21px;
  margin-bottom:6px;
}

.subtitle{
  color:#91aaa1;
  font-size:13px;
  margin-bottom:23px;
}

.status{
  display:none;

  padding:12px 14px;
  margin-bottom:16px;

  border-radius:13px;

  font-size:12px;
  line-height:1.5;
}

.status.error{
  display:block;
  background:#ff4d4d12;
  border:1px solid #ff555530;
  color:#ffb0b0;
}

.status.success{
  display:block;
  background:#19c97812;
  border:1px solid #19c97835;
  color:#9af0c5;
}

label{
  display:block;
  font-size:13px;
  color:#c7d8d2;
  margin-bottom:7px;
}

.field{
  margin-bottom:16px;
}

.input{
  width:100%;
  padding:14px 15px;

  background:#04150f;

  border:1px solid #ffffff18;
  border-radius:15px;

  outline:none;

  color:#fff;

  font-size:15px;

  transition:.2s;
}

.input:focus{
  border-color:#19c978;
  box-shadow:0 0 0 3px #19c97815;
}

.input::placeholder{
  color:#5f776f;
}

.password{
  position:relative;
}

.password .input{
  padding-right:50px;
}

.toggle{
  position:absolute;
  right:7px;
  top:50%;

  transform:translateY(-50%);

  width:38px;
  height:38px;

  border:0;
  border-radius:10px;

  background:#ffffff08;

  color:#9fb8ae;

  cursor:pointer;
}

.terms{
  display:flex;
  gap:8px;
  align-items:flex-start;

  color:#8fa89f;

  font-size:11px;
  line-height:1.5;

  margin:4px 0 19px;
}

.terms input{
  margin-top:2px;
  accent-color:#19c978;
}

.terms a{
  color:#19c978;
  text-decoration:none;
}

.register{
  width:100%;

  padding:16px;

  border:0;
  border-radius:16px;

  background:
    linear-gradient(135deg,#19c978,#0c9e5b);

  color:#fff;

  font-size:15px;
  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.register:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 30px #19c97830;
}

.register:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;

  margin:22px 0;

  color:#617b71;
  font-size:11px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#ffffff12;
}

.login{
  text-align:center;
  color:#8fa89f;
  font-size:13px;
}

.login a{
  color:#19c978;
  font-weight:700;
  text-decoration:none;
}

.footer{
  text-align:center;
  margin-top:18px;

  color:#506b61;
  font-size:10px;
}

.spinner{
  display:inline-block;

  width:15px;
  height:15px;

  border:2px solid #ffffff55;
  border-top-color:#fff;

  border-radius:50%;

  animation:spin .7s linear infinite;

  vertical-align:middle;

  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">

    <div class="logo">
      EP
    </div>

    <h1>EarnPulse</h1>

    <p>
      Create your account and get started.
    </p>

  </div>


  <div class="card">

    <h2>
      Create account
    </h2>

    <p class="subtitle">
      Enter your details below to register.
    </p>


    <div
      id="status"
      class="status">
    </div>


    <form id="registerForm">


      <!-- NAME -->

      <div class="field">

        <label>
          Full Name
        </label>

        <input
          id="name"
          class="input"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>


      <!-- EMAIL -->

      <div class="field">

        <label>
          Email Address
        </label>

        <input
          id="email"
          class="input"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

      </div>


      <!-- PHONE -->

      <div class="field">

        <label>
          M-Pesa Phone Number
        </label>

        <input
          id="phone"
          class="input"
          type="tel"
          placeholder="0712345678"
          maxlength="13"
          autocomplete="tel"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label>
          Password
        </label>

        <div class="password">

          <input
            id="password"
            class="input"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="toggle"
            onclick="togglePassword('password')">

            👁

          </button>

        </div>

      </div>


      <!-- CONFIRM -->

      <div class="field">

        <label>
          Confirm Password
        </label>

        <div class="password">

          <input
            id="confirmPassword"
            class="input"
            type="password"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="toggle"
            onclick="togglePassword('confirmPassword')">

            👁

          </button>

        </div>

      </div>


      <!-- TERMS -->

      <label class="terms">

        <input
          id="terms"
          type="checkbox"
          required
        >

        <span>
          I agree to the
          <a href="terms.html">
            Terms & Conditions
          </a>
          and
          <a href="privacy.html">
            Privacy Policy
          </a>.
        </span>

      </label>


      <button
        id="registerBtn"
        class="register"
        type="submit">

        Create Account

      </button>

    </form>


    <div class="divider">
      OR
    </div>


    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>


  <div class="footer">
    © 2026 EarnPulse
  </div>

</div>


<script>

const API_URL = "";


/*
|--------------------------------------------------------------------------
| Password visibility
|--------------------------------------------------------------------------
*/

function togglePassword(id){

  const input =
    document.getElementById(id);

  input.type =
    input.type === "password"
      ? "text"
      : "password";

}


/*
|--------------------------------------------------------------------------
| Status
|--------------------------------------------------------------------------
*/

function showStatus(
  message,
  type
){

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "status " + type;

  status.textContent =
    message;

}


/*
|--------------------------------------------------------------------------
| Phone normalization
|--------------------------------------------------------------------------
*/

function normalizePhone(phone){

  let value =
    phone
      .replace(/\s+/g,"")
      .replace(/-/g,"");

  if(value.startsWith("+254")){
    value =
      value.substring(1);
  }

  if(
    value.startsWith("07") ||
    value.startsWith("01")
  ){

    value =
      "254" +
      value.substring(1);

  }

  return value;
}


/*
|--------------------------------------------------------------------------
| Registration
|--------------------------------------------------------------------------
*/

document
  .getElementById("registerForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;

      const terms =
        document
          .getElementById("terms")
          .checked;

      const button =
        document.getElementById(
          "registerBtn"
        );


      if(password !== confirmPassword){

        showStatus(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      const cleanPhone =
        normalizePhone(phone);


      if(
        !/^254[17][0-9]{8}$/.test(
          cleanPhone
        )
      ){

        showStatus(
          "Enter a valid Kenyan M-Pesa number.",
          "error"
        );

        return;
      }


      if(!terms){

        showStatus(
          "Please accept the Terms & Conditions.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.innerHTML =
        '<span class="spinner"></span>Creating account...';


      try{

        const response =
          await fetch(
            API_URL +
            "/api/auth/register",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({

                name:name,

                email:email,

                phone:cleanPhone,

                password:password

              })
            }
          );


        const data =
          await response.json();


        if(
          !response.ok ||
          !data.success
        ){

          throw new Error(
            data.message ||
            "Registration failed."
          );

        }


        showStatus(
          "Account created successfully. Redirecting to login...",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
              "login.html";

          },
          1000
        );


      }catch(error){

        console.error(
          "REGISTER ERROR:",
          error
        );

        showStatus(
          error.message ||
          "Unable to connect to server.",
          "error"
        );

        button.disabled =
          false;

        button.textContent =
          "Create Account";

      }

    }
  );

</script>

</body>
            </html>
